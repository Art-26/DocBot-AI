<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>DocBot AI — Triagem Médica Virtual</title>
</head>
<body>

    <div class="chat-card">
        <div class="chat-header">
            <div class="avatar">🩺</div>
            <div class="info">
                <h2>DocBot AI</h2>
                <p>Triagem Médica Virtual</p>
            </div>
        </div>

        <div class="chat-body" id="chatContainer">
            <div class="message bot">
                Olá! Sou o DocBot AI. Descreva seus sintomas ou informe a modalidade do atendimento para iniciarmos a triagem.
            </div>
        </div>

        <div class="chat-footer">
            <input type="text" id="userInput" placeholder="Digite aqui..." onkeypress="tratarEnter(event)">
            <button onclick="enviarMensagem()">Enviar</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
